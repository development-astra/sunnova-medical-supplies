{% extends 'account/_layout.html' %}
{% block title %}Sign In{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="auth-card__head">
    <h1 class="auth-card__title">Welcome back</h1>
    <p class="auth-card__sub">Sign in to view your orders and account.</p>
  </div>

  <form class="auth-form" method="post" action="{{ url_for('account_login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    {% if request.args.get('next') %}
      <input type="hidden" name="next" value="{{ request.args.get('next') }}" />
    {% endif %}

    <div class="reqform__field">
      <label class="reqform__label" for="email">Email <span class="req">*</span></label>
      <input class="reqform__input" id="email" name="email" type="email"
             autocomplete="username" placeholder="you@example.com" required autofocus />
    </div>

    <div class="reqform__field">
      <label class="reqform__label" for="password">Password <span class="req">*</span></label>
      <input class="reqform__input" id="password" name="password" type="password"
             autocomplete="current-password" placeholder="••••••••" required />
    </div>

    <button type="submit" class="btn btn--primary auth-form__btn">Sign In</button>
  </form>

  <p class="auth-card__alt">
    New to Sunnova? <a href="{{ url_for('account_register') }}">Create an account</a>
  </p>
</div>
{% endblock %}
